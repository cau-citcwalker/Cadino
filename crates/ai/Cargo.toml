[package]
name = "cadcraft-ai"
description = "Cadino's AI assistant: the MCP tool set and an agent loop over Anthropic Claude, OpenAI GPT and OpenAI-compatible local models"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# `~3.4`: the per-read timeout wraps ureq's `unversioned` transport, which may change in minor releases.
ureq = { version = "~3.4", default-features = false, features = ["rustls"] }
# Windows Credential Manager, macOS Keychain, and the Secret Service over pure-Rust D-Bus (no system libraries).
keyring = "4"
